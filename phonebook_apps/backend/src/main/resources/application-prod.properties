# ===========================================================================
# PRODUCTION CONFIGURATION (SPRING_PROFILES_ACTIVE=prod)
# ---------------------------------------------------------------------------
# Activated on Render with the environment variable SPRING_PROFILES_ACTIVE=prod.
# Every credential is read from the environment: there is deliberately NO
# fallback value for secrets, so the container refuses to start (fail fast)
# instead of silently running with a development default.
# Variable reference: see DEPLOYMENT.md
# ===========================================================================

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
# Render (and any Docker platform) requires the app to listen on $PORT.
server.port=${PORT:8080}
server.forward-headers-strategy=framework
# Let in-flight requests finish during a rolling deploy / instance restart.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ---------------------------------------------------------------------------
# Database - Aiven for MySQL (TLS is always enabled)
# ---------------------------------------------------------------------------
# Example resolved URL:
#   jdbc:mysql://phonebook-db.aivencloud.com:12345/phonebook_db
#     ?sslMode=REQUIRED&allowPublicKeyRetrieval=true&serverTimezone=UTC
#
# DB_SSL_MODE   REQUIRED (default) encrypts the connection without verifying the
#               server certificate, which is what Aiven documents for MySQL.
#               For full certificate + hostname verification set
#               DB_SSL_MODE=VERIFY_IDENTITY and DB_SSL_EXTRA as described in
#               DEPLOYMENT.md ("Hardened TLS verification").
# DB_SSL_EXTRA  extra JDBC parameters appended verbatim. Must start with '&'.
#
# DB_HOST / DB_PORT / DB_NAME / DB_USERNAME / DB_PASSWORD are read from the
# environment and have NO fallback value. Note that Spring binds
# `spring.datasource.*` leniently: a variable that is missing entirely is not
# reported by name. It stays literal in the JDBC URL, so start-up aborts with
#   Application run failed ... java.net.UnknownHostException: ${DB_HOST}
# (or "Access denied for user '${DB_USERNAME}'"). The deploy fails either way and
# /api/health never turns green - see DEPLOYMENT.md > Troubleshooting.
# DB_URL (optional) replaces the composed URL completely, e.g. behind a proxy.
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=${DB_SSL_MODE:REQUIRED}&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8${DB_SSL_EXTRA:}}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool sized for a managed (small) Aiven MySQL plan.
spring.datasource.hikari.pool-name=PhonebookHikariPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=120000
# Aiven closes idle connections (~5 min); recycle below that to avoid
# "Communications link failure" on the first request after a quiet period.
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=60000
# Fail the deploy quickly when the database is unreachable or misconfigured.
spring.datasource.hikari.initialization-fail-timeout=15000

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
# Default is "update" so a fresh Aiven database is created automatically.
# Once the schema is in place, run the DDL in db/schema.sql yourself and set
# JPA_DDL_AUTO=validate (see DEPLOYMENT.md -> "Strict schema mode").
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------------------------
# JWT - secret supplied by the platform (Render: generated value)
# ---------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------------------------------------------------------------------------
# CORS - must contain the exact Netlify site URL(s), no trailing slash
# ---------------------------------------------------------------------------
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.phonebook=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=WARN
