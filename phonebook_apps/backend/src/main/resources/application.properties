spring.application.name=phonebook-backend

# ===========================================================================
# LOCAL DEVELOPMENT DEFAULTS (profile: none / "default")
# ---------------------------------------------------------------------------
# Every value below can be overridden with an environment variable, so this
# file keeps working on a laptop while production values are supplied by the
# hosting platform. Production overrides live in application-prod.properties,
# which is activated with SPRING_PROFILES_ACTIVE=prod.
# See DEPLOYMENT.md for the full production variable reference.
# ===========================================================================

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
# ${PORT:8080} keeps the app portable: container platforms (Render, Docker,
# Heroku) inject PORT. Falls back to 8080 for local development.
server.port=${PORT:8080}
# Honour X-Forwarded-* headers added by the platform's TLS-terminating proxy.
server.forward-headers-strategy=framework

# ---------------------------------------------------------------------------
# Database (local MySQL defaults)
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/phonebook_db?sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------------------------------------------------------------------------
# JWT
# ---------------------------------------------------------------------------
# LOCAL DEV ONLY. The fallback below is a throw-away development key and is
# intentionally NOT used in production: application-prod.properties requires
# the JWT_SECRET environment variable and fails fast when it is missing.
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------------------------------------------------------------------------
# CORS
# ---------------------------------------------------------------------------
# Comma separated list of browser origins allowed to call this API.
# Local Vite dev server (5173), Vite preview (4173) and CRA (3000) by default.
# Production sets APP_CORS_ALLOWED_ORIGINS to the Netlify site URL.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://localhost:3000}

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.level.com.phonebook=${LOG_LEVEL_APP:DEBUG}
logging.level.org.springframework.security=INFO
